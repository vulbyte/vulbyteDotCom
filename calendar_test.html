<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vulbyte - Stream Schedule</title>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #e6edf3;
            margin: 0;
            padding: 20px;
        }

        #calendar-container {
            max-width: 1100px;
            margin: 0 auto;
            background: #161b22;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid #30363d;
        }

        .fc { color: #e6edf3; }
        .fc-theme-standard td, .fc-theme-standard th { border-color: #30363d !important; }
        .fc-button-primary {
            background-color: #21262d !important;
            border-color: #363b42 !important;
            color: #c9d1d9 !important;
        }
        .fc-button-primary:hover { background-color: #30363d !important; }
        .fc-button-active {
            background-color: #1f6feb !important;
            border-color: #1f6feb !important;
            color: #fff !important;
        }
        .fc-event { cursor: pointer; border-radius: 4px; padding: 2px 4px; font-weight: 500; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 20px;
            color: #8b949e;
            cursor: pointer;
        }
        .close-btn:hover { color: #ffffff; }

        .modal-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
        .modal-date { color: #58a6ff; font-size: 0.9rem; margin-bottom: 16px; }
        .modal-desc { color: #8b949e; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.4; }

        .modal-links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #238636;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .modal-links a:hover { background: #2ea043; }
    </style>
</head>
<body>

    <div id="calendar-container">
        <div id="calendar"></div>
    </div>

    <div id="event-modal" class="modal">
        <div class="modal-content">
            <span id="close-btn" class="close-btn">&times;</span>
            <div id="modal-title" class="modal-title">Stream Title</div>
            <div id="modal-date" class="modal-date">Date & Time</div>
            <div id="modal-description" class="modal-desc">Description</div>
            <div id="modal-links-container" class="modal-links"></div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        const modal = document.getElementById('event-modal');
        const closeModalBtn = document.getElementById('close-btn');

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek'
            },
            
            // FullCalendar natively fetches static JSON files
            events: './events.json',

            eventClick: function(info) {
                info.jsEvent.preventDefault(); 
                document.getElementById('modal-title').textContent = info.event.title;
                
                const dateOptions = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                document.getElementById('modal-date').textContent = info.event.start.toLocaleDateString(undefined, dateOptions);

                const props = info.event.extendedProps;
                document.getElementById('modal-description').textContent = props.description || 'No description available.';

                const linksContainer = document.getElementById('modal-links-container');
                linksContainer.innerHTML = ''; 
                
                if (props.links && props.links.length > 0) {
                    props.links.forEach(link => {
                        const anchor = document.createElement('a');
                        anchor.href = link.url;
                        anchor.target = "_blank"; 
                        anchor.innerHTML = link.icon ? `<i class="${link.icon}"></i> ${link.name}` : link.name;
                        linksContainer.appendChild(anchor);
                    });
                }

                modal.style.display = 'flex';
            }
        });

        calendar.render();

        closeModalBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target == modal) modal.style.display = 'none'; };
    });
    </script>
</body>
</html>
