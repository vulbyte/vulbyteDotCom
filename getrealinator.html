<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./client_management.js" type="module"></script>
    <title>getrealinator</title>
</head>
<body>

    <div class="container">
	    <div style="display:flex; flex-direction:row;">
		<h2>getrealinator</h2>
		<img 
		 	style="height:3rem; width:3rem; margin-left:3rem; margin-top:4rem;"
			src="https://tr.rbxcdn.com/180DAY-5b5c671a68c176d93cb6050cb2fccdcc/420/420/Hat/Webp/noFilter"
		>
	    </div>
        <input type="file" id="imageInput" accept="image/*,.gif">
        <br>
        <canvas id="memeCanvas"></canvas>
        <br>
        <a id="download" download="get-real.png">Download Image</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const imageInput = document.getElementById('imageInput');
            const canvas = document.getElementById('memeCanvas');
            const ctx = canvas.getContext('2d');
            const downloadBtn = document.getElementById('download');

            if (imageInput) {
                imageInput.addEventListener('change', (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const img = new Image();
                        img.onload = function () {
                            const bannerHeight = Math.max(60, img.height * 0.15);
                            
                            canvas.width = img.width;
                            canvas.height = img.height + bannerHeight;

                            ctx.fillStyle = '#FFFFFF';
                            ctx.fillRect(0, 0, canvas.width, bannerHeight);

                            ctx.drawImage(img, 0, bannerHeight);

                            ctx.fillStyle = '#000000';
                            const fontSize = Math.floor(bannerHeight * 0.65);
                            ctx.font = `bold ${fontSize}px Impact, sans-serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            
                            ctx.fillText('GET REAL', canvas.width / 2, bannerHeight / 2);

                            canvas.style.display = 'inline-block';
                            downloadBtn.style.display = 'inline-block';
                            downloadBtn.href = canvas.toDataURL('image/png');
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }
        });
    </script>
</body>
</html>
